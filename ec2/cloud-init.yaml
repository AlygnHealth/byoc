#cloud-config
package_update: true
package_upgrade: true

# Amazon Linux 2023 ships the AWS CLI; `awscli` is no package name there, and
# one unknown name stops the whole list installing, docker included.
packages:
  - docker

# No SSH users or keys: operators reach a node through SSM Session Manager
# (`aws ssm start-session --target <instance-id>`), which needs no open port.

runcmd:
  - systemctl start docker
  - systemctl enable docker
  - mkdir -p /etc/nimbus/secrets
  - chmod 700 /etc/nimbus/secrets
  # A block, because a plain YAML scalar cannot hold the ": " in these headers.
  - |
    IMDS=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60") && sed s/IPADDRESS/$(curl -fsS -H "X-aws-ec2-metadata-token: $IMDS" http://169.254.169.254/latest/meta-data/local-ipv4)/g < /etc/nimbus-template/config.template.json > /etc/nimbus/secrets/partial-config.json
  - systemctl daemon-reload
  - systemctl enable --now unison-cloud

write_files:
  - path: /etc/nimbus-template/config.template.json
    permissions: "0644"
    encoding: base64
    content: ${config_template}

  # The cluster token is kept in SSM Parameter Store rather than in this
  # launch template's user data, so it never sits in OpenTofu state or in
  # anything that can read a launch template. The wrapper merges every *.json
  # in /etc/nimbus/secrets into nimbus's config.
  - path: /usr/local/bin/nimbus-fetch-secrets
    permissions: "0700"
    content: |
      #!/bin/bash
      set -euo pipefail
      umask 077
      token=$(aws ssm get-parameter --region ${region} --with-decryption --name '${cluster_token_parameter}' --query Parameter.Value --output text)
      printf '{"cloudApiToken":"%s"}\n' "$token" > /etc/nimbus/secrets/.cloud-token.tmp
      mv -f /etc/nimbus/secrets/.cloud-token.tmp /etc/nimbus/secrets/cloud-token.json

  - path: /etc/systemd/system/unison-cloud.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Unison Cloud Service
      Requires=docker.service
      After=docker.service network-online.target

      [Service]
      Type=simple
      Restart=always
      RestartSec=10
      ExecStartPre=-/usr/bin/docker stop unison-cloud
      ExecStartPre=-/usr/bin/docker rm unison-cloud
      # Writes the cluster token from SSM where the wrapper merges config.
      ExecStartPre=/usr/local/bin/nimbus-fetch-secrets
      ExecStart=/usr/bin/docker run \
        --name unison-cloud \
        --rm \
        -p 8081:8081 \
        -p 8082:8082 \
        -p 9091:9091 \
        -e NIMBUS_CONFIG_DIR=/etc/nimbus/secrets \
        -e NIMBUS_POLL_IAM_CREDENTIALS=true \
        -e NIMBUS_MAX_CONNECTIONS_PER_HOST=64 \
        -v /etc/nimbus/secrets:/etc/nimbus/secrets \
        unisoncomputing/unison-cloud:${unison_cloud_image_tag}
      ExecStop=/usr/bin/docker stop unison-cloud

      [Install]
      WantedBy=multi-user.target
